# general setting
name: topkids
backend: dp # DataParallel
type: SpectralBasisLearningModel 
num_gpu: 1 #
gpu_idx: 4 # 
manual_seed: 1234
non-isometric: false 
G_zoomout: false
save_filter: true
visualize: true

# path
path:
  resume_state: checkpoints/topkids.pth
  resume: false

# datasets
datasets:
  test_dataset:
    name: Val
    type: PairTopKidsDataset
    phase: test
    data_root: ../data/TOPKIDS/
    return_evecs: true
    return_faces: true
    num_evecs: 200
    return_dist: true

# network setting
networks:
  feature_extractor:
    type: DiffusionNet
    in_channels: 16
    out_channels: 128
    cache_dir: ../data/TOPKIDS/diffusion
    input_type: hks
  permutation:
    type: Similarity
    tau: 0.07
    hard: true
  basisconv:
    type: EigenBasis_Fliters
    C_inout: 200
  
# validation setting
val:
  metrics:
    geo_error:
      type: calculate_geodesic_error
    plot_pck:
      type: plot_pck
