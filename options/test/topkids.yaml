# general setting
name: topkids_FAP_SHOT_test
backend: dp # DataParallel
type: SHREC16_FAPModel
num_gpu: 1 # 这里设置1, 表示只在单卡上运行， 不要改动
gpu_idx: 4 # 指定运行下标
manual_seed: 1234
refine: 0 #15 #15
non-isometric: false
partial: false
topo: true  #  
# desc_path : 
train_desc_path : ../data/TOPKIDS/descs/SHOT_v7/ # descriptor path
test_desc_path : ../data/TOPKIDS/descs/SHOT_v7/  # descriptor path
visualize: true

# path
path:
  resume_state: experiments/FAP_topkids_SHOT/models/2000.pth  #checkpoints/topkids.pth #experiments/topkids/models/12000.pth  #
  resume: false

# datasets
datasets:
  test_dataset:
    name: Val
    type: PairTopKidsDataset
    phase: test
    data_root: ../data/TOPKIDS/
    return_evecs: true
    return_faces: true
    num_evecs: 200
    return_dist: true

# network setting
networks:
  feature_extractor:
    type: RefineNet
  fmap_net:
    type: RegularizedFMNet
    bidirectional: false  #
  permutation:
    type: Similarity
    tau: 0.07
    hard: true

  conv:
    type: Learned_Fliters
    Poly_Type: JacobiConv
    orders: 8 
    alpha: 1.0 
    learnable_bases: True #True 
    learnable_alphas: True
    normalized_bases: True
    a: 1.0
    b: 1.0
  # #3 combination
  comb:
    type: Combination
    orders_basis: 8 
    output_channels: 6

# training setting
train:
  total_epochs: 
  optims:
    feature_extractor:
      type: Adam
      lr: 1.0e-3
    conv:
      type: Adam
      lr: 1.0e-3
    comb:
      type: Adam
      lr: 1.0e-3
  schedulers:
    feature_extractor:
      type: none
    conv:
      type: none
    comb:
      type: none
  losses:
    surfmnet_loss:
      type: SURFMNetLoss
      w_bij: 1.0
      w_orth: 1.0
      w_lap: 0.0
    align_loss:
      type: SquaredFrobeniusLoss
      loss_weight: 1.0
    # dirichlet_loss:
    #   type: DirichletLoss
    #   loss_weight: 5.0

# validation setting
val:
  metrics:
    geo_error:
      type: calculate_geodesic_error
    plot_pck:
      type: plot_pck
