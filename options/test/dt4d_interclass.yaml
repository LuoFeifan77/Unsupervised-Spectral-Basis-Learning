# general setting
name: dt4d_interclass
backend: dp # DataParallel
type: SpectralBasisLearningModel  
num_gpu: 1 # 
gpu_idx: 1 # 
manual_seed: 1234
non-isometric: true 
G_zoomout: false
save_filter: true
visualize: true

# path
path:
  resume_state: checkpoints/dt4d.pth
  resume: false

# datasets
datasets:
  test_dataset:
    name: Val
    type: PairDT4DDataset
    phase: test
    data_root: ../data/DT4D_r/
    inter_class: true
    return_evecs: true
    return_faces: true
    num_evecs: 200
    return_corr: true
    return_dist: true

# network setting
networks:
  #1
  feature_extractor:
    type: DiffusionNet
    in_channels: 16
    out_channels: 128
    cache_dir: ../data/DT4D_r/diffusion
    input_type: hks
  permutation:
    type: Similarity
    tau: 0.07
    hard: true # 

  #2 learnable filter
  basisconv:
    type: EigenBasis_Fliters
    C_inout: 200

# validation setting
val:
  metrics:
    geo_error:
      type: calculate_geodesic_error
    plot_pck:
      type: plot_pck
