# general setting
name: dt4d
backend: dp # DataParallel
type: SpatialLearningBasisModel # FMNetModel 
num_gpu: 1 # 这里设置1, 表示只在单卡上运行， 不要改动
gpu_idx: 1 # 指定运行下标
manual_seed: 1234
# refine : 15
partial: false
save_filter: false
zoomout_refine: true
visualize: false

# path
path:
  resume_state: experiments/dt4d_archived_20250827_020040/models/20000.pth
  resume: false

# datasets
datasets:
  test_dataset:
    name: Val
    type: PairDT4DDataset
    phase: test
    data_root: ../data/DT4D_r/
    inter_class: true
    return_evecs: true
    return_faces: true
    num_evecs: 200
    return_corr: true
    return_dist: true

# network setting
networks:
  #1
  feature_extractor:
    type: DiffusionNet
    in_channels: 16
    out_channels: 128
    cache_dir: ../data/DT4D_r/diffusion
    input_type: hks
  permutation:
    type: Similarity
    tau: 0.07
    hard: true #  true

  #2 learnable filter
  basisconv:
    type: EigenBasis_Fliters
    C_inout: 200

#training setting
# train:
#   optims: 
#     feature_extractor:
#       type: Adam
#       lr: 1.0e-3
#     basisconv:
#       type: Adam
#       lr: 1.0e-3
#   schedulers:  # 
#     feature_extractor:
#       type: none
#     basisconv:
#       type: none

  # losses:
  #   align_loss:
  #     type: SquaredFrobeniusLoss
  #     loss_weight: 1.0

# validation setting
val:
  metrics:
    geo_error:
      type: calculate_geodesic_error
    plot_pck:
      type: plot_pck
