# general setting
name: dt4d_intra_class
backend: dp # DataParallel
type: SpatialLearningBasisModel # FMNetModel 
num_gpu: 1 # 
gpu_idx: 1 # 指定运行下标
manual_seed: 1234
# refine : 15
partial: false
save_filter: false
zoomout_refine: true
visualize: false

# path
path:
  resume_state: checkpoints_ours/dt4d_archived_20250827_020040/models/20000.pth  #experiments/dt4d/models/16000.pth
  resume: false

# datasets
datasets:
  test_dataset:
    name: Val
    type: PairDT4DDataset
    phase: test
    data_root: ../data/DT4D_r/
    inter_class: false
    return_evecs: true
    return_faces: true
    num_evecs: 200
    return_corr: true
    return_dist: true

# network setting
networks:
  #1 feature extractor
  feature_extractor:
    type: DiffusionNet
    in_channels: 16  #16 # 128
    out_channels: 128  #128 # 256
    cache_dir: ../data/DT4D_r/diffusion
    input_type: hks
  permutation:
    type: Similarity
    tau: 0.07
  #2 learnable filter
  basisconv:
    type: EigenBasis_Fliters
    C_inout: 200

# validation setting
val:
  metrics:
    geo_error:
      type: calculate_geodesic_error
    plot_pck:
      type: plot_pck
