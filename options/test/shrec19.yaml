# general setting
name: shrec19
backend: dp # DataParallel
type: new_MSFOPModel
num_gpu: 0
manual_seed: 1234
refine: 0
non-isometric: false #false
partial: false
visualize: false

# path
path:
  resume_state: experiments/scape/models/8000.pth  #
  resume: false

# datasets
datasets:
  test_dataset:
    name: Shrec19Val
    type: PairShrec19Dataset
    phase: test
    data_root: ../data/SHREC19_r
    return_evecs: True
    return_faces: True
    num_evecs: 200
    return_dist: True

# network setting
networks:
  #1 extracor 
  feature_extractor:
    type: DiffusionNet
    in_channels: 128
    out_channels: 256
    cache_dir: ../data/SHREC19_r/diffusion
    input_type: wks
  fmap_net:
    type: RegularizedFMNet
    bidirectional: false
  permutation:
    type: Similarity
    tau: 0.07
    hard: true

  #2 learnable filter
  conv:
    type: Learned_Fliters
    Poly_Type: JacobiConv
    orders: 32 
    alpha: 1.0 
    learnable_bases: True #True 
    learnable_alphas: True
    normalized_bases: True
    a: 1.0
    b: 1.0
  
  #3 combination
  comb:
    type: Combination
    orders_basis: 32 
    output_channels: 16


# training setting
train:
  optims:
    feature_extractor:
      type: Adam
      lr: 1.0e-3
    conv:
      type: Adam
      lr: 1.0e-3
    comb:
      type: Adam
      lr: 1.0e-3
  schedulers:  # 
    feature_extractor:
      type: none
    conv:
      type: none
    comb:
      type: none

  losses:
    surfmnet_loss:
      type: SURFMNetLoss
      w_bij: 1.0
      w_orth: 1.0
      w_lap: 0.0
    align_loss:
      type: SquaredFrobeniusLoss
      loss_weight: 1.0


# validation setting
val:
  metrics:
    geo_error:
      type: calculate_geodesic_error
    plot_pck:
      type: plot_pck
