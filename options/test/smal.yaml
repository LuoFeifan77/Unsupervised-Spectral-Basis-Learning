# general setting
name: smal
backend: dp # DataParallel
type: SpatialLearningBasisModel # FMNetModel 
num_gpu: 1 # 这里设置1, 表示只在单卡上运行， 不要改动
gpu_idx: 2 # 指定运行下标
manual_seed: 1234
# refine : 15  #15
non-isometric: true
partial: false
save_filter: false
zoomout_refine: false
visualize: false

# path
path:
  resume_state: experiments/smal_archived_20250827_020053/models/17000.pth
  resume: false

# datasets
datasets:
  test_dataset:
    name: Val
    type: PairSmalDataset
    phase: test
    data_root: ../data/SMAL_r/
    category: false  #true
    return_evecs: true
    return_faces: true
    num_evecs: 200
    return_corr: true
    return_dist: true

# network setting
networks:
  #1
  feature_extractor:
    type: DiffusionNet
    in_channels: 16
    out_channels: 128
    cache_dir: ../data/SMAL_r/diffusion
    input_type: hks
  permutation:
    type: Similarity
    tau: 0.07
    hard: true   # 训练的时候是false

  #2 learnable filter
  basisconv:
    type: EigenBasis_Fliters
    C_inout: 200


#training setting
# train:
#   optims: 
#     feature_extractor:
#       type: Adam
#       lr: 1.0e-3
#     basisconv:
#       type: Adam
#       lr: 1.0e-3
#   schedulers:  # 
