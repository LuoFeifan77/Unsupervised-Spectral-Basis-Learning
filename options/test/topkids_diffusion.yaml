# general setting
name: topkids
backend: dp # DataParallel
type: SpatialLearningBasisModel # FMNetModel 
num_gpu: 1 # 这里设置1, 表示只在单卡上运行， 不要改动
gpu_idx: 4 # 指定运行下标
manual_seed: 1234
# non-isometric: false #false  let iter = 1 
partial: false
save_filter: false
zoomout_refine: true
visualize: false


# path
path:
  resume_state: experiments/topkids_archived_20250827_020230/models/12000.pth
  resume: false

# datasets
datasets:
  test_dataset:
    name: Val
    type: PairTopKidsDataset
    phase: test
    data_root: ../data/TOPKIDS/
    return_evecs: true
    return_faces: true
    num_evecs: 200
    return_dist: true

# network setting
networks:
  feature_extractor:
    type: DiffusionNet
    in_channels: 16
    out_channels: 128
    cache_dir: ../data/TOPKIDS/diffusion
    input_type: hks
  permutation:
    type: Similarity
    tau: 0.07
    hard: true
  basisconv:
    type: EigenBasis_Fliters
    C_inout: 200
  
  
