# general setting
name: smal_F
backend: dp # DataParallel
type: new_MSFOPModel
num_gpu: 6
manual_seed: 1234
refine: 0 #10
non-isometric: true
partial: false
visualize: true

# path
path:
  resume_state: experiments/smal_F/models/2000.pth
  resume: false

# datasets
datasets:
  test_dataset:
    name: Val
    type: PairSmalDataset
    phase: test
    data_root: ../data/SMAL_r/
    category: false
    return_evecs: true
    return_faces: true
    num_evecs: 200
    return_corr: true
    return_dist: true

# network setting
networks:
  #1
  feature_extractor:
    type: DiffusionNet
    in_channels: 3
    out_channels: 256
    cache_dir: ../data/SMAL_r/diffusion
    input_type: xyz
  fmap_net:
    type: RegularizedFMNet
    bidirectional: false
  permutation:
    type: Similarity
    tau: 0.07
    hard: true

  #2 learnable filter
  # conv:
  #   type: Learned_Fliters
  #   Poly_Type: JacobiConv
  #   orders: 32 
  #   alpha: 1.0 
  #   learnable_bases: True #True 
  #   learnable_alphas: True
  #   normalized_bases: True
  #   a: 1.0
  #   b: 1.0
  
  # #3 combination
  # comb:
  #   type: Combination
  #   orders_basis: 32 
  #   output_channels: 16

  conv:
    type: Heat_Kernel_Fliters
    C_inout: 256   # number of filters

