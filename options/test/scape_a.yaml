# general setting
name: scape_a_s
backend: dp # DataParallel
type: SpectralBasisLearningModel 
num_gpu: 1 #
gpu_idx: 1 # 
manual_seed: 1234
non-isometric: false  
G_zoomout: true
save_filter: true
visualize: true

path:
  resume_state: checkpoints/scape.pth
  resume: false

# datasets
datasets:
  test_dataset:
    name: ScapeVal
    type: PairDataset
    data_root: ../data/SCAPE_a/
    return_evecs: True
    return_faces: True
    num_evecs: 200
    return_corr: True
    return_dist: True

# network setting
networks:
  #1
  feature_extractor:
    type: DiffusionNet
    in_channels: 16
    out_channels: 128
    cache_dir: ../data/SCAPE_a/diffusion
    input_type: hks
  permutation:
    type: Similarity
    tau: 0.07
    hard: true #  true

  #2 learnable filter
  basisconv:
    type: EigenBasis_Fliters
    C_inout: 200

# validation setting
val:
  metrics:
    geo_error:
      type: calculate_geodesic_error
    plot_pck:
      type: plot_pck
