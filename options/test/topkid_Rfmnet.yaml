# general setting
name: topkids_Rfmnet
backend: dp # DataParallel
type: RfmnetModel
num_gpu: 1 # 这里设置1, 表示只在单卡上运行， 不要改动
gpu_idx: 1 # 指定运行下标
manual_seed: 1234
non-isometric: false
partial: false
visualize: true
train_desc_path : ../data/TOPKIDS/descs/SHOT_v7/ # descriptor path
test_desc_path : ../data/TOPKIDS/descs/SHOT_v7/  # descriptor path


# path
path:
  resume_state: experiments/topkids_Rfmnet/models/2000.pth
  resume: false

# datasets
datasets:
  test_dataset:
    name: Val
    type: PairTopKidsDataset
    phase: test
    data_root: ../data/TOPKIDS/
    return_evecs: true
    return_faces: true
    num_evecs: 128  # for MWP
    return_dist: true

# network setting
networks:
  feature_extractor:
    type: RefineNet
  permutation:
    type: Similarity
    tau: 0.07

val:
  metrics:
    geo_error:
      type: calculate_geodesic_error
    plot_pck:
      type: plot_pck
