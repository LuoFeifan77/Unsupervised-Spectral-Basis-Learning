# general setting
name: smal
backend: dp # DataParallel
type: SpectralBasisLearningModel  
num_gpu: 1 # 
gpu_idx: 4 # 
manual_seed: 1234
non-isometric: True #
partial: false
save_filter: true

# path
path:
  resume_state: ~

# datasets
datasets:
  train_dataset:
    name: SmalTrain
    type: PairSmalDataset
    phase: train
    data_root: ../data/SMAL_r/
    category: False # True for 29/20
    return_evecs: True
    return_faces: True
    num_evecs: 200 
    return_corr: True
    return_dist: False
  test_dataset:
    name: SmalVal
    type: PairSmalDataset
    phase: test
    data_root: ../data/SMAL_r/
    category: False #True
    return_evecs: True
    return_faces: True
    num_evecs: 200 #200
    return_corr: True
    return_dist: True
  # setting for train dataset
  batch_size: 1
  num_worker: 16

# network setting
networks:
  feature_extractor:
    type: DiffusionNet
    in_channels: 16  
    out_channels: 128  
    cache_dir: ../data/SMAL_r/diffusion
    input_type: hks
  permutation:
    type: Similarity
    tau: 0.07
  basisconv:
    type: EigenBasis_Fliters
    C_inout: 200

# training setting
train:
  total_epochs: 20
  optims:
    feature_extractor:
      type: Adam
      lr: 1.0e-3
    basisconv:
        type: Adam
        lr: 1.0e-3
  schedulers:
    feature_extractor:
      type: CosineAnnealingLR
      eta_min: 1.0e-4
      T_max: 20   #  
    basisconv:
      type: CosineAnnealingLR
      eta_min: 1.0e-4
      T_max: 15 #15
  losses:
    mrsloss:
      type: MRSLoss
      loss_weight: 1.0

# validation setting
val:
  val_freq: 2000 #
  metrics:
    geo_error:
      type: calculate_geodesic_error
    plot_pck:
      type: plot_pck

# log setting
logger:
  print_freq: 100
  save_checkpoint_freq: 2000
