# general setting
name: smal_F
backend: dp # DataParallel
type: new_MSFOPModel
num_gpu: 3 #auto
manual_seed: 1234
non-isometric: true
partial: false

# path
path:
  resume_state: ~

# datasets
datasets:
  train_dataset:
    name: SmalTrain
    type: PairSmalDataset
    phase: train
    data_root: ../data/SMAL_r/
    category: False
    return_evecs: True
    return_faces: True
    num_evecs: 200
    return_corr: False
    return_dist: False
  test_dataset:
    name: SmalVal
    type: PairSmalDataset
    phase: test
    data_root: ../data/SMAL_r/
    category: False
    return_evecs: True
    return_faces: True
    num_evecs: 200
    return_corr: True
    return_dist: True
  # setting for train dataset
  batch_size: 1
  num_worker: 16

# network setting
networks:
  #1 Unsupervised LRSSM
  feature_extractor:
    type: DiffusionNet
    in_channels: 3
    out_channels: 256
    cache_dir: ../data/SMAL_r/diffusion
    input_type: xyz
  fmap_net:
    type: RegularizedFMNet
    bidirectional: true
  permutation:
    type: Similarity
    tau: 0.07

  # #2 learnable filter
  conv:
    type: Learned_Fliters
    Poly_Type: JacobiConv
    orders: 32 
    alpha: 1.0 
    learnable_bases: True #True 
    learnable_alphas: True
    normalized_bases: True
    a: 1.0
    b: 1.0
  
  # #3 combination
  comb:
    type: Combination
    orders_basis: 32 
    output_channels: 16

  #2 learnable filter
  # conv:
  #   type: Heat_Kernel_Fliters
  #   C_inout: 256   # number of filters


# training setting
train:
  total_epochs: 30 # 15
  optims: 
    feature_extractor:
      type: Adam
      lr: 1.0e-3
    conv:
      type: Adam
      lr: 1.0e-3
    comb:
      type: Adam
      lr: 1.0e-3

  schedulers:  # 
    feature_extractor:
      type: CosineAnnealingLR  # 这个非常重要
      eta_min: 1.0e-4
      T_max: 10 #15
    conv:
      type: CosineAnnealingLR
      eta_min: 1.0e-4
      T_max: 10 #15
    comb:
      type: CosineAnnealingLR
      eta_min: 1.0e-4
      T_max: 10 #15

  losses:
    surfmnet_loss:
      type: SURFMNetLoss 
      w_bij: 1.0
      w_orth: 1.0     
      w_lap: 0.0
      bidirectional_loss: true
    align_loss:
      type: SquaredFrobeniusLoss
      loss_weight: 1.0
    # dirichlet_loss:
    #   type: DirichletLoss
    #   loss_weight: 5.0


# validation setting
val:
  val_freq: 2000
  metrics:
    geo_error:
      type: calculate_geodesic_error
    plot_pck:
      type: plot_pck

# log setting
logger:
  print_freq: 20
  save_checkpoint_freq: 2000