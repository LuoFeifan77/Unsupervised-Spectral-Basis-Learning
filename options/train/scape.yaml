# general setting
name: scape
backend: dp # DataParallel
type: SpectralBasisLearningModel   
num_gpu: 1 # 
gpu_idx: 4 # 
manual_seed: 1234
non-isometric: false
partial: false
save_filter: true
G_zoomout: true

# path
path:
  resume_state: ~

# datasets
datasets:
  train_dataset:
    name: ScapeTrain
    type: PairScapeDataset
    phase: train
    data_root: ../data/SCAPE_r
    return_evecs: True
    return_faces: True
    num_evecs: 200
    return_corr: False
    return_dist: False
  # test_dataset1:
  #   name: ScapeTest
  #   type: PairScapeDataset
  #   phase: test
  #   data_root: ../data/SCAPE_r
  #   return_evecs: True
  #   return_faces: True
  #   num_evecs: 200
  #   return_corr: True
  #   return_dist: True
  # test_dataset2:
  #   name: ScapeVal
  #   type: PairDataset
  #   data_root: ../data/SCAPE_a/
  #   return_evecs: True
  #   return_faces: True
  #   num_evecs: 200
  #   return_corr: True
  #   return_dist: True    
  test_dataset:
    name: Shrec19Val
    type: PairShrec19Dataset
    phase: test
    data_root: ../data/SHREC19_r
    return_evecs: True
    return_faces: True
    num_evecs: 200
    return_dist: True
  # setting for train dataset
  batch_size: 1
  num_worker: 16

# network setting
networks:
  #1
  feature_extractor:
    type: DiffusionNet
    in_channels: 16
    out_channels: 128
    cache_dir: ../data/SCAPE_r/diffusion
    input_type: hks
  permutation:
    type: Similarity
    tau: 0.07
  #2 learnable filter
  basisconv:
    type: EigenBasis_Fliters
    C_inout: 200

# training setting
train:
  total_epochs: 10 # 15
  optims: 
    feature_extractor:
      type: Adam
      lr: 1.0e-3
    basisconv:
      type: Adam
      lr: 1.0e-3
  schedulers:  # 
    feature_extractor:
      type: CosineAnnealingLR  
      eta_min: 1.0e-4
      T_max: 30 #15
    basisconv:
      type: CosineAnnealingLR
      eta_min: 1.0e-4
      T_max: 30
  losses:
    mrsloss:
      type: MRSLoss
      loss_weight: 1.0

# validation setting
val:
  val_freq: 1000 
  metrics:
    geo_error:
      type: calculate_geodesic_error
    plot_pck:
      type: plot_pck

# log setting
logger: 
  print_freq: 100
  save_checkpoint_freq: 1000
