# general setting
name: shrec16_holes
backend: dp # DataParallel
type: parttopo_MSFOPModel
num_gpu: 5 #auto
manual_seed: 1234
non-isometric: false
partial: true
key_words : holes
train_desc_path : ../data/SHREC16/
test_desc_path : ../data/SHREC16_test/ # descriptor path

# path
path:
  resume_state: ~
#   resume_state: checkpoints/tosca.pth
#   resume: false

# datasets
datasets:
  train_dataset:
    name: Shrec16Train
    type: PairShrec16Dataset
    data_root: ../data/SHREC16/
    cut_type: holes
    return_evecs: True
    return_faces: True
    num_evecs: 200
    return_corr: False
    return_dist: False
  test_dataset:
    name: Shrec16Val
    type: PairShrec16Dataset
    data_root: ../data/SHREC16_test/
    cut_type: holes
    return_evecs: True
    return_faces: True
    num_evecs: 200
    return_corr: True
    return_dist: True
  # setting for train dataset
  batch_size: 1
  num_worker: 16

# network setting
networks:
  feature_extractor:
    type: RefineNet #DiffusionNet  # 
  fmap_net:
    type: RegularizedFMNet
    bidirectional: true
  permutation:
    type: Similarity
    tau: 0.07
  #2 learnable filter
  conv:
    type: Learned_Fliters
    Poly_Type: JacobiConv
    orders: 32 
    alpha: 1.0 
    learnable_bases: True #True 
    learnable_alphas: True
    normalized_bases: True
    a: 1.0
    b: 1.0
  # #3 combination
  comb:
    type: Combination
    orders_basis: 32 
    output_channels: 16

  # conv:
  #   type: Heat_Kernel_Fliters
  #   C_inout: 256   # number of filters

# training setting
train:
  total_epochs: 300  # 训练的次数真的多！
  optims:
    feature_extractor:
      type: Adam
      lr: 1.0e-3
    conv:
      type: Adam
      lr: 1.0e-3
    comb:
      type: Adam
      lr: 1.0e-3

  schedulers:
    feature_extractor:
      type: CosineAnnealingLR
      eta_min: 1.0e-4
      T_max: 15 # 300
    conv:
      type: CosineAnnealingLR
      eta_min: 1.0e-4
      T_max: 15 #15
    comb:
      type: CosineAnnealingLR
      eta_min: 1.0e-4
      T_max: 15 #15
  
  losses:
    surfmnet_loss:
      type: PartialFmapsLoss
      w_bij: 1.0
      w_orth: 1.0
    align_loss:
      type: SquaredFrobeniusLoss
      loss_weight: 1.0

# validation setting
val:
  val_freq: 2000
  metrics:
    geo_error:
      type: calculate_geodesic_error
    plot_pck:
      type: plot_pck

# log setting
logger:
  print_freq: 20
  save_checkpoint_freq: 2000
