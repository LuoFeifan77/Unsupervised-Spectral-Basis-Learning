# general setting
name: dt4d
backend: dp # DataParallel
type: SpectralBasisLearningModel   
num_gpu: 1 # 
gpu_idx: 5 # 
manual_seed: 1234
non-isometric: true # false
partial: false
save_filter: true
# path
path:
  resume_state: ~

# datasets
datasets:
  train_dataset1:
    name: DT4DIntraTrain
    type: PairDT4DDataset
    phase: train
    data_root: ../data/DT4D_r/
    inter_class: False
    return_evecs: True
    return_faces: True
    num_evecs: 200 
    return_corr: False
    return_dist: False
  train_dataset2:
    name: DT4DInterTrain
    type: PairDT4DDataset
    phase: train
    data_root: ../data/DT4D_r/
    inter_class: True
    return_evecs: True
    return_faces: True
    num_evecs: 200 #200
    return_corr: False
    return_dist: False
  test_dataset:
    name: DT4DTest
    type: PairDT4DDataset
    phase: test
    data_root: ../data/DT4D_r/
    inter_class: True
    return_evecs: True
    return_faces: True
    num_evecs: 200
    return_corr: True
    return_dist: True
  # setting for train dataset
  batch_size: 1
  num_worker: 16

# network setting
networks:
  #1 feature extractor
  feature_extractor:
    type: DiffusionNet
    in_channels: 16  
    out_channels: 128  
    cache_dir: ../data/DT4D_r/diffusion
    input_type: hks
  permutation:
    type: Similarity
    tau: 0.07
  #2 learnable filter
  basisconv:
    type: EigenBasis_Fliters
    C_inout: 200

# training setting
train:
  total_epochs: 10 # 15
  optims: 
    feature_extractor:
      type: Adam
      lr: 1.0e-3
    basisconv:
      type: Adam
      lr: 1.0e-3
  schedulers:  # 
    feature_extractor:
      type: CosineAnnealingLR  
      eta_min: 1.0e-4
      T_max: 10 
    basisconv:
      type: CosineAnnealingLR
      eta_min: 1.0e-4
      T_max: 10
  losses:
    mrsloss:
      type: MRSLoss
      loss_weight: 1.0

# validation setting
val:
  val_freq: 4000
  metrics:
    geo_error:
      type: calculate_geodesic_error
    plot_pck:
      type: plot_pck

# log setting
logger:
  print_freq: 100
  save_checkpoint_freq: 4000
