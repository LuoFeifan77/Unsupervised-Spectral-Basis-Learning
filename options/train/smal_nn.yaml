# general setting
name: smal_LearningBasis_zoomout
backend: dp # DataParallel
type: LearningBasisNNModel  #OnlyLearningBasisModel # FMNetModel 
num_gpu: 1 # 这里设置1, 表示只在单卡上运行， 不要改动
gpu_idx: 6 # 指定运行下标
manual_seed: 1234
non-isometric: True #false
partial: false

# path
path:
  resume_state: ~
  # resume_state: checkpoints/smal.pth
  # resume: false

# 分开训练，利用学习好的diffusion，然后在进行滤波器训练

# datasets
datasets:
  train_dataset:
    name: SmalTrain
    type: PairSmalDataset
    phase: train
    data_root: ../data/SMAL_r/
    category: True
    return_evecs: True
    return_faces: True
    num_evecs: 200
    return_corr: True
    return_dist: False
  test_dataset:
    name: SmalVal
    type: PairSmalDataset
    phase: test
    data_root: ../data/SMAL_r/
    category: True
    return_evecs: True
    return_faces: True
    num_evecs: 200
    return_corr: True
    return_dist: True
  # setting for train dataset
  batch_size: 1
  num_worker: 16

# network setting
networks:
  feature_extractor:
    type: DiffusionNet
    in_channels: 3
    out_channels: 256
    cache_dir: ../data/SMAL_r/diffusion
    input_type: xyz
  fmap_net:
    type: RegularizedFMNet #LearningBasisRegularizedFMNet #RegularizedFMNet
    bidirectional: true
  # 这个置换矩阵应该去掉
  permutation:
    type: Similarity
    tau: 0.07
  #2 learnable filter
  basisconv:
    type: EigenBasis_Fliters

# training setting
train:
  total_epochs: 20
  optims:
    feature_extractor:
      type: Adam
      lr: 1.0e-3
  basisconv:
      type: Adam
      lr: 1.0e-3
    # eigconv:
    #   type: Adam
    #   lr: 1.0e-3
  schedulers:
    feature_extractor:
      type: CosineAnnealingLR
      eta_min: 1.0e-4
      T_max: 20   #  
    basisconv:
      type: CosineAnnealingLR
      eta_min: 1.0e-4
      T_max: 15 #15
    # eigconv: 
    #   type: CosineAnnealingLR
    #   eta_min: 1.0e-4
    #   T_max: 15 #15

  losses:
    surfmnet_loss:
      type: SURFMNetLoss 
      w_bij: 1.0
      w_orth: 1.0     
      w_lap: 0.0
    align_loss:
      type: SquaredFrobeniusLoss
      loss_weight: 1.0
    # dirichlet_loss:
    #   type: DirichletLoss
    #   loss_weight: 5.0

# validation setting
val:
  val_freq: 2000 #
  metrics:
    geo_error:
      type: calculate_geodesic_error
    plot_pck:
      type: plot_pck

# log setting
logger:
  print_freq: 20
  save_checkpoint_freq: 1000
