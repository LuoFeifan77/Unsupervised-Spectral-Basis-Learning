# general setting
name: topkids_Rfmnet
backend: dp # DataParallel
type: RfmnetModel
num_gpu: 1 # 这里设置1, 表示只在单卡上运行， 不要改动
gpu_idx: 1 # 指定运行下标
manual_seed: 1234
non-isometric: false
partial: false
# topo: true   # add new 
# desc_path : 
train_desc_path : ../data/TOPKIDS/descs/SHOT_v7/ # descriptor path
test_desc_path : ../data/TOPKIDS/descs/SHOT_v7/  # descriptor path
# path
path:
  resume_state: ~

# datasets
datasets:
  train_dataset:
    name: Train
    type: PairTopKidsDataset
    phase: train
    data_root: ../data/TOPKIDS/
    return_evecs: True
    return_faces: True
    num_evecs: 128 #200
    return_dist: False
  test_dataset:
    name: Test
    type: PairTopKidsDataset
    phase: test
    data_root: ../data/TOPKIDS/
    return_evecs: True
    return_faces: True
    num_evecs: 128 #200
    return_dist: True
  # setting for train dataset
  batch_size: 1
  num_worker: 16

# network setting
networks:
  feature_extractor:
    type: RefineNet
  permutation:
    type: Similarity
    tau: 0.07

# training setting
train:
  total_epochs: 10 #100
  optims:
    feature_extractor:
      type: Adam
      lr: 1.0e-3
  schedulers:
    feature_extractor:
      type: none

  losses:
    align_loss:
      type: SquaredFrobeniusLoss
      loss_weight: 1.0

# validation setting
val:
  val_freq: 2000 #4000
  metrics:
    geo_error:
      type: calculate_geodesic_error
    plot_pck:
      type: plot_pck

# log setting
logger:
  print_freq: 20
  save_checkpoint_freq: 2000
